  <svg aria-hidden="true" width="0" height="0" style="position:absolute;left:-9999px;overflow:hidden">
    <defs>
      <filter id="noisyGradient_nav" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="noise"/>
        <feColorMatrix in="noise" type="saturate" values="0" result="monoNoise"/>
        <feComponentTransfer in="monoNoise" result="grain">
          <feFuncA type="table" tableValues="0 0.9"/>
        </feComponentTransfer>
        <feComposite in="grain" in2="SourceAlpha" operator="in" result="grainInShape"/>
        <feBlend in="SourceGraphic" in2="grainInShape" mode="screen"/>
      </filter>
    </defs>
  </svg>
